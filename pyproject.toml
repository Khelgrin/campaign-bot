[project]
name = "journalbot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "discord-py>=2.6,<3",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
journalbot = "journalbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.0,<9",
    "coverage>=7.0,<8",
    "diff-cover>=9.0,<10",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs/UI_guidelines"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = "^(venv|\\.venv|docs/UI_guidelines)/"
